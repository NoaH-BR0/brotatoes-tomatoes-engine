
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brotatoes Tomatoes Engine</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(
    to bottom,
    #a8e8ef 0%,
    #75d8e2 25%,
    #35b8cc 50%,
    #187b9b 75%,
    #062f4a 100%
  );
}

/* CALCULATOR */

.screen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 20px;
}

#calculator {
  position: relative;
  background: #ffffff;
  font-family: Arial, sans-serif;
  width: 310px;
  max-width: 100%;
  padding: 15px;
  border: 1px solid #aaa;
  box-shadow: 0 5px 20px #999;
}

#calculator h3 {
  color: black;
}

#display {
  width: 100%;
  height: 65px;
  font-size: 30px;
  text-align: right;
  border: 1px solid #aaa;
  margin-bottom: 12px;
  padding: 8px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

#calculator button {
  height: 52px;
  font-size: 19px;
  font-family: Arial, sans-serif;
  border: 1px solid #aaa;
  background: #fafafa;
  cursor: pointer;
}

#calculator button:hover {
  background: #ddd;
}

/* BLUE SEASHELL */

.shell-decoration {
  position: absolute;
  width: 65px;
  height: 65px;
  top: -30px;
  right: -25px;
  z-index: 2;
  pointer-events: none;
  transform: rotate(-25deg);
}

/* SECRET ARCADE */

#arcade {
  display: none;
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  text-align: center;
  font-family: 'Silkscreen', sans-serif;
  color: #10445f;
}

#arcade h1 {
  font-size: clamp(18px, 4vw, 30px);
  color: #10445f;
}

#arcade h2 {
  font-size: 20px;
  color: #10445f;
  margin-top: 35px;
}

#arcade > p {
  font-size: 12px;
}

.game-library {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  margin: 30px 0;
}

.game-card {
  background: #d8f7f7;
  border: 2px solid #187b9b;
  padding: 20px;
  min-height: 130px;
  box-shadow: 4px 4px 0 #10445f;
}

.game-card h3 {
  color: #187b9b;
  font-size: 15px;
}

.game-card p {
  color: #10445f;
  font-size: 11px;
}

/* OCEAN DEPTHS */

.ocean-depth {
  min-height: 65vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 30px;
  color: #d8f7f7;
}

.ocean-depth h2 {
  color: #d8f7f7 !important;
}

.ocean-depth p {
  color: #bdeff2;
  font-size: 12px;
}

#arcade button {
  font-family: 'Silkscreen', sans-serif;
  background: #d8f7f7;
  color: #10445f;
  border: 2px solid #187b9b;
  padding: 12px 18px;
  cursor: pointer;
  margin: 20px;
}

#arcade button:hover {
  background: #75d8e2;
}

@media (max-width: 500px) {
  .game-library {
    grid-template-columns: 1fr;
  }

  #arcade {
    padding: 5px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <!-- CALCULATOR -->
  <div id="calculator">

    <!-- BLUE SEASHELL -->
    <img src="seashell.png" class="shell-decoration" alt="">

    <h3>Calculator</h3>

    <input id="display" value="0" readonly>

    <div class="buttons">
      <button onclick="clearDisplay()">C</button>
      <button onclick="add('/')">÷</button>
      <button onclick="add('*')">×</button>
      <button onclick="backspace()">⌫</button>

      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button onclick="add('-')">−</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button onclick="add('+')">+</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>

      <button onclick="calculate()"
        style="grid-row:span 2;height:110px">=</button>

      <button onclick="add('0')">0</button>
      <button onclick="add('.')">.</button>
    </div>

  </div>

  <!-- HIDDEN GAME LIBRARY -->
  <div id="arcade">

    <h1>🍅 BROTATOES TOMATOES ENGINE</h1>
    <p>SECRET ACCESS GRANTED</p>

    <h2>THE GAME LIBRARY</h2>

    <div class="game-library">

      <div class="game-card">
        <h3>GAME 1</h3>
        <p>Coming soon...</p>
      </div>

      <div class="game-card">
        <h3>GAME 2</h3>
        <p>Coming soon...</p>
      </div>

      <div class="game-card">
        <h3>GAME 3</h3>
        <p>Coming soon...</p>
      </div>

      <div class="game-card">
        <h3>GAME 4</h3>
        <p>Coming soon...</p>
      </div>

    </div>


    <section class="ocean-depth">
      <h2>SHALLOW WATER</h2>
      <p>Keep exploring...</p>
    </section>

    <section class="ocean-depth">
      <h2>DEEP WATER</h2>
      <p>More games will appear down here.</p>
    </section>

    <section class="ocean-depth">
      <h2>THE DEEP</h2>
      <p>You've reached the bottom!</p>
    </section>

    <button onclick="closeArcade()">
      RETURN TO CALCULATOR
    </button>

  </div>

</div>

<script>
const display = document.getElementById("display");

function add(value) {
  if (display.value === "0" || display.value === "Error") {
    display.value = value;
  } else {
    display.value += value;
  }
}

function clearDisplay() {
  display.value = "0";
}

function backspace() {
  display.value = display.value.slice(0, -1) || "0";
}

function calculate() {
  try {
    if (!/^[0-9+*/.() -]+$/.test(display.value)) throw Error();

    const result = Function("return (" + display.value + ")")();

    if (!Number.isFinite(result)) throw Error();

    display.value = String(result);
  } catch {
    display.value = "Error";
  }
}

const secretCode = [
  "ARROWUP", "ARROWUP",
  "ARROWDOWN", "ARROWDOWN",
  "ARROWLEFT", "ARROWRIGHT",
  "ARROWLEFT", "ARROWRIGHT",
  "B", "A", "ENTER"
];

let progress = 0;

document.addEventListener("keydown", function(event) {
  const key = event.key.toUpperCase();

  if (key === secretCode[progress]) {
    progress++;

    if (progress === secretCode.length) {
      openArcade();
      progress = 0;
    }
  } else {
    progress = key === secretCode[0] ? 1 : 0;
  }
});

function openArcade() {
  document.getElementById("calculator").style.display = "none";
  document.getElementById("arcade").style.display = "block";
}

function closeArcade() {
  document.getElementById("arcade").style.display = "none";
  document.getElementById("calculator").style.display = "block";
}
</script>

</body>
</html>
